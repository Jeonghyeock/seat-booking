name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # 로컬과 같은 주 버전(DESIGN 6.4)
      postgres:
        image: postgres:18
        env:
          # 이 job이 끝나면 버려지는 DB라 비밀번호 없이 띄운다(저장소에 비밀번호 글자를 두지 않으려고).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 3단계까지 쓰던 X-User-Id 헤더로 사용자를 정하는 코드가 남으면 누구로든 행세할 수 있다(DESIGN 6.3). 테스트 파일은 뺀다.
      - name: X-User-Id가 코드에 남지 않았는지
        # grep은 찾으면 0, 못 찾으면 1, 오류(경로가 없음 등)면 2다. 1일 때만 통과시켜 검사가 조용히 꺼지지 않게 한다.
        run: |
          rc=0
          grep -rIni --include='*.ts' --exclude='*.test.ts' 'x-user-id' apps/api/src packages/shared/src || rc=$?
          test "$rc" -eq 1
      # 로컬과 같게 슈퍼유저가 아닌 앱 role로 마이그레이션과 테스트를 돌린다.
      # 비밀번호는 실행마다 새로 만들어, 저장소에 비밀번호 글자가 남지 않게 한다.
      - name: 앱 role과 DB 만들기(README의 로컬 준비와 같음)
        run: |
          APP_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$APP_PASSWORD"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE seat_booking LOGIN CREATEDB PASSWORD '$APP_PASSWORD'" \
            -c "CREATE DATABASE seat_booking OWNER seat_booking"
          echo "DATABASE_URL=postgres://seat_booking:$APP_PASSWORD@localhost:5432/seat_booking" >> "$GITHUB_ENV"
      - run: npm run db:migrate -w @seat-booking/api
      - run: npm test
      # 화면을 묶을 수 있는지(Vite가 shared의 TS 원본까지 묶는다). typecheck와 단위 테스트는 워크스페이스로 위에서 돈다.
      - run: npm run build -w @seat-booking/web

  # 가입 → 선점 → 결제 → 내 예매를 브라우저로 한 번 돈다(DESIGN 6.5 E2E). 따로 띄운 API·화면과 E2E 전용 DB를 쓴다.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 앱 role 만들기(README의 로컬 준비와 같음)
        run: |
          APP_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$APP_PASSWORD"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \n            -c "CREATE ROLE seat_booking LOGIN CREATEDB PASSWORD '$APP_PASSWORD'" \n            -c "CREATE DATABASE seat_booking OWNER seat_booking"
          echo "DATABASE_URL=postgres://seat_booking:$APP_PASSWORD@localhost:5432/seat_booking" >> "$GITHUB_ENV"
      # 브라우저는 캐시하지 않는다(복원이 내려받기와 비슷하게 걸리고, apt 의존성은 캐시할 수 없다).
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: apps/web
      - run: npm run test:e2e -w @seat-booking/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7
